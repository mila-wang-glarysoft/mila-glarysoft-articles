name: 自动创建每月文件夹

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  create-folder:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 获取当前年月
        id: date
        run: |
          YEAR_MONTH=$(date +'%Y-%m')
          echo "YEAR_MONTH=$YEAR_MONTH" >> $GITHUB_ENV

      - name: 检查并创建文件夹
        id: create
        run: |
          CATEGORIES=(
            "content/how-to/clean-up-repair"
            "content/how-to/optimize-improve"
            "content/how-to/privacy-security"
            "content/how-to/files-folders"
            "content/how-to/system-tools"
          )

          CREATED=false

          for CATEGORY in "${CATEGORIES[@]}"; do
            # 确保基础目录存在，并创建 .gitkeep 防止被 Git 忽略
            mkdir -p "$CATEGORY"
            touch "$CATEGORY/.gitkeep"

            TARGET_DIR="${CATEGORY}/${YEAR_MONTH}"
            if [ ! -d "$TARGET_DIR" ]; then
              echo "创建目录: $TARGET_DIR"
              mkdir -p "$TARGET_DIR"
              # 🔑 关键修复：在月份目录中创建 .gitkeep 文件
              touch "$TARGET_DIR/.gitkeep"
              CREATED=true
            else
              echo "目录已存在: $TARGET_DIR"
            fi
          done

          echo "folder_created=${CREATED}" >> $GITHUB_OUTPUT

      - name: 提交并推送新文件夹
        if: steps.create.outputs.folder_created == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 添加所有变更，包括新文件
          git add .
          # 检查是否有变更需要提交
          if git diff --staged --quiet; then
            echo "没有新的变更需要提交"
          else
            git commit -m "自动创建 $(date +'%Y年%m月') 文件夹"
            git push
          fi
