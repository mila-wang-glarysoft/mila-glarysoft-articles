name: 自动创建每月文件夹

on:
  # 定时触发：每天北京时间早上 8 点运行一次
  schedule:
    - cron: '0 0 * * *'  # UTC 0:00 = 北京时间 21:20
  
  # 也支持手动触发，方便测试
  workflow_dispatch:

jobs:
  create-folder:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 获取当前年月
        id: date
        run: |
          echo "year_month=$(date +'%Y-%m')" >> $GITHUB_OUTPUT
          echo "year=$(date +'%Y')" >> $GITHUB_OUTPUT
          echo "month=$(date +'%m')" >> $GITHUB_OUTPUT

      - name: 创建所有分类的当月文件夹
        env:
          YEAR_MONTH: ${{ steps.date.outputs.year_month }}
        run: |
          # 定义所有需要创建月份文件夹的分类路径
          CATEGORIES=(
            "content/how-to/clean-up-repair"
            "content/how-to/optimize-improve"
            "content/how-to/privacy-security"
            "content/how-to/files-folders"
            "content/how-to/system-tools"
          )
          
          FOLDER_CREATED=false
          
          for CATEGORY in "${CATEGORIES[@]}"; do
            TARGET_DIR="${CATEGORY}/${YEAR_MONTH}"
            if [ ! -d "$TARGET_DIR" ]; then
              echo "创建目录: $TARGET_DIR"
              mkdir -p "$TARGET_DIR"
              FOLDER_CREATED=true
            else
              echo "目录已存在: $TARGET_DIR"
            fi
          done
          
          if [ "$FOLDER_CREATED" = true ]; then
            echo "FOLDER_CREATED=true" >> $GITHUB_ENV
          fi

      - name: 提交并推送新文件夹
        if: env.FOLDER_CREATED == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "自动创建 $(date +'%Y年%m月') 文件夹"
          git push
