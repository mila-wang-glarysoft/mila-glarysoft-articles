name: 自动创建每月文件夹

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  create-folder:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 获取当前年月
        id: date
        run: |
          echo "YEAR_MONTH=$(date +'%Y-%m')" >> $GITHUB_ENV

      - name: 检查并创建文件夹
        id: create
        run: |
          # 定义需要创建月份子文件夹的基础路径
          CATEGORIES=(
            "content/how-to/clean-up-repair"
            "content/how-to/optimize-improve"
            "content/how-to/privacy-security"
            "content/how-to/files-folders"
            "content/how-to/system-tools"
          )

          CREATED=false

          for CATEGORY in "${CATEGORIES[@]}"; do
            # 确保基础分类目录存在
            mkdir -p "$CATEGORY"

            TARGET_DIR="${CATEGORY}/${YEAR_MONTH}"
            if [ ! -d "$TARGET_DIR" ]; then
              echo "创建目录: $TARGET_DIR"
              mkdir -p "$TARGET_DIR"
              CREATED=true
            else
              echo "目录已存在: $TARGET_DIR"
            fi
          done

          # 通过 GITHUB_OUTPUT 设置输出变量 (新语法)
          echo "folder_created=${CREATED}" >> $GITHUB_OUTPUT

      - name: 提交并推送新文件夹
        if: steps.create.outputs.folder_created == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "自动创建 $(date +'%Y年%m月') 文件夹"
          git push
