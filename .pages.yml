media:
  input: public/uploads
  output: /articles/uploads

content:
  - name: how_to
    label: How To
    type: group
    items:
      - name: how_to_clean_up_repair
        label: Clean Up & Repair
        type: collection
        path: content/how-to/clean-up-repair  # 保持静态路径
        filename: "{year}-{month}/{primary}.md"  # 在文件名中创建子路径
        view:
          fields: [title, author, date, draft]
          primary: title
          sort: [date, title]
          search: [title, author, body]
          default:
            sort: date
            order: desc
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: categories
            label: Categories
            type: select
            required: true
            default: clean-up-repair
            options:
              values:
                - clean-up-repair
          - name: author
            label: Author
            type: string
          - name: date
            label: Publish Date
            type: date
            required: true
          - name: featured_image
            label: Featured Image
            type: image
          - name: draft
            label: Draft
            type: boolean
            default: false
          - name: nofollow_links
            label: Nofollow external links
            hidden: true
            type: boolean
            default: true
          - name: body
            label: Body
            type: rich-text
