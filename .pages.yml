media:
  input: public/uploads
  output: /uploads

content:
  - name: how_to_clean_up_repair
    label: How To / Clean Up & Repair
    type: collection
    path: content/how-to/clean-up-repair
    filename: '{fields.slug}.md'
    view:
      fields: [title, category, author, date, draft]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: slug
        label: Slug
        type: string
        required: true
        pattern:
          regex: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          message: Use lowercase letters, numbers, and hyphens only.
      - name: category
        label: Category
        type: select
        required: true
        default: clean-up-repair
        options:
          - clean-up-repair
          - optimize-improve
          - privacy-security
          - files-folders
          - system-tools
      - name: author
        label: Author
        type: string
      - name: date
        label: Publish Date
        type: date
        required: true
      - name: excerpt
        label: Excerpt
        type: text
      - name: featured_image
        label: Featured Image
        type: image
      - name: reading_time
        label: Reading Time
        type: string
      - name: draft
        label: Draft
        type: boolean
        default: false
      - name: body
        label: Body
        type: rich-text

