media:
  input: public/uploads
  output: /articles/uploads

components:
  defaultFields: 
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: categories
        label: Categories
        type: select
        required: true
        options:
          values:
            - # 注意：这里不再写死默认值，而是在具体的 collection 中覆盖
      - name: author
        label: Author
        type: string
      - name: date
        label: Publish Date
        type: date
        required: true
      - name: featured_image
        label: Featured Image
        type: image
      - name: draft
        label: Draft
        type: boolean
        default: false
      - name: nofollow_links
        label: Nofollow external links
        hidden: true
        type: boolean
        default: true
      - name: body
        label: Body
        type: rich-text

  defaultView:
    view:
      fields: [title, author, date, draft]
      primary: title
      sort: [date, title]
      search: [title, author, body]
      default:
        sort: date
        order: desc
content:
  - name: how_to
    label: How To
    type: group
    path: content/how-to/clean-up-repair/*-*    
    items:
      # 直接罗列各个子分类的 collection，不再嵌套多余的 group
      - name: clean_up_repair
        label: Clean Up & Repair
        type: collection
        # 使用 pattern 匹配该分类下所有年月文件夹
        pattern: content/how-to/clean-up-repair/*-*
        filename: "{primary}.md"
        fields:
          - component: defaultView
          - component: defaultFields
          - name: categories
            label: Categories
            type: select
            required: true
            default: clean-up-repair
            options:
              values:
                - clean-up-repair
    