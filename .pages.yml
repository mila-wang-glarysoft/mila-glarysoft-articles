media:
  input: public/uploads
  output: /articles/uploads

components:
  defaultFields: 
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: categories
        label: Categories
        type: select
        required: true
        options:
          values:
            - # 注意：这里不再写死默认值，而是在具体的 collection 中覆盖
      - name: author
        label: Author
        type: string
      - name: date
        label: Publish Date
        type: date
        required: true
      - name: featured_image
        label: Featured Image
        type: image
      - name: draft
        label: Draft
        type: boolean
        default: false
      - name: nofollow_links